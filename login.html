<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Iniciar sesión – PCReserve</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/proyecto.css" />
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body class="lg">
    <div class="lbox">
      <!-- ESPACIO PARA EL LOGO: guarda tu imagen como img/logo.png (se reemplaza sola) -->
      <span class="brand-mark"
        ><img
          src="../images/logo.jpeg"
          alt="Logo de la empresa"
          onerror="this.onerror=null;this.src='../img/logo-placeholder.svg'"
      /></span>
      <h1>PC<b style="color: var(--ac2)">Reserve</b></h1>
      <p class="s">Instituto Nacional San Luis · Acceso al sistema de préstamos</p>
      <div class="tabs">
        <button id="tL" type="button" class="on">Iniciar sesión</button
        ><button id="tR" type="button">Registrarse</button>
      </div>
      <div id="nameWrap" style="display: none">
        <label for="fName">Nombre completo</label><input id="fName" autocomplete="name" />
      </div>
      <label for="fMail">Correo electrónico</label
      ><input id="fMail" type="email" autocomplete="email" />
      <label for="fPass">Contraseña</label
      ><input id="fPass" type="password" autocomplete="current-password" />
      <div id="roleWrap" style="display: none">
        <label for="fRole">Rol</label
        ><select id="fRole">
          <option value="Estudiante">Estudiante</option>
          <option value="Docente">Docente</option>
        </select>
      </div>
      <div class="msg" id="fMsg" role="status"></div>
      <button id="fGo" type="button" style="width: 100%; margin-top: 8px">Entrar</button>
      <a class="back" href="proyecto.html">← Volver al tablero</a>
      <div class="hint">
        Tu cuenta se guarda en Firebase. Al registrarte entras como Estudiante o Docente; el
        administrador lo asigna el encargado del sistema.
      </div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/login.js"></script>
  </body>
</html>
